<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="darabanana">
    <meta name="description" content="Paleta de colores">
    <link rel="stylesheet" href="style.css">
    <title>Colores</title>
</head>
<body>
    <header>
        <h2>Mejores Paletas de Colores para tu sitio web</h2>
        <div class="boton-container">
            <button id="btn-modo">Cambiar</button>
        </div>
    </header>

    <main>
        <div class="tarjeta-1">
            <p>Paleta Neutra</p>
            <img src="img/neutra.jpg" alt="Paleta Neutra">
        </div>

        <div class="tarjeta-2">
            <p>Paleta pastel</p>
            <img src="img/pastel.jpg" alt="Paleta Pastel">
        </div>

        <div class="tarjeta-3">
            <p>Paleta vibrante</p>
            <img src="img/vibrantes.jpg" alt="Paleta Vibrante">
        </div>

        <div class="tarjeta-4">
            <p>Paleta monocromatica</p>
            <img src="img/monocromatica.jpg" alt="Paleta Monocromática">
        </div>

        <div class="tarjeta-5">
            <p>Paleta duocromatica</p>
            <img src="img/duo.jpg" alt="Paleta Duocromática">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
